{% extends "base.html" %}

{% block title %}Sign In - FinanceBot AI{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="glass-card" style="width: 100%; max-width: 440px; padding: 36px; border-radius: 24px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px; width: 54px; height: 54px; font-size: 1.6rem;">
        <i class="fas fa-brain"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.5px;">Welcome Back</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px;">Sign in to your AI Financial Advisor</p>
    </div>

    <!-- 1-Click Demo Account Banner -->
    <div style="background: rgba(99, 102, 241, 0.12); border: 1px dashed rgba(99, 102, 241, 0.4); border-radius: var(--radius-md); padding: 14px; margin-bottom: 24px; text-align: center;">
      <div style="font-size: 0.82rem; color: #a5b4fc; margin-bottom: 8px; font-weight: 600;">
        <i class="fas fa-wand-magic-sparkles"></i> Evaluating or testing?
      </div>
      <a href="{{ url_for('auth.demo_login') }}" class="btn btn-primary btn-sm" style="width: 100%;" id="btn-demo-login">
        Instant Demo Login (Alex Morgan)
      </a>
    </div>

    <form action="{{ url_for('auth.login') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
        </div>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; font-size: 0.85rem;">
        <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" name="remember" style="accent-color: var(--accent-primary);"> Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;" id="btn-signin">
        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
      Don't have an account? 
      <a href="{{ url_for('auth.register') }}" style="color: var(--accent-primary); font-weight: 600;">Create one free</a>
    </div>

  </div>
</div>
{% endblock %}
