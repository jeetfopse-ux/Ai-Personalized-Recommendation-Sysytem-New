{% extends "base.html" %}

{% block title %}Create Account - FinanceBot AI{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
  <div class="glass-card" style="width: 100%; max-width: 480px; padding: 36px; border-radius: 24px;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-icon" style="margin: 0 auto 16px; width: 54px; height: 54px; font-size: 1.6rem;">
        <i class="fas fa-brain"></i>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.5px;">Create Your Account</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 6px;">Start building wealth with AI-driven intelligence</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST">
      <div class="form-group">
        <label class="form-label" for="reg_username">Full Name</label>
        <input type="text" id="reg_username" name="username" class="form-control" placeholder="Alex Morgan" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_email">Email Address</label>
        <input type="email" id="reg_email" name="email" class="form-control" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg_currency">Preferred Currency</label>
        <select id="reg_currency" name="currency" class="form-control">
          <option value="$">$ USD / CAD / AUD (Dollar)</option>
          <option value="€">€ EUR (Euro)</option>
          <option value="£">£ GBP (British Pound)</option>
          <option value="₹">₹ INR (Indian Rupee)</option>
          <option value="¥">¥ JPY / CNY (Yen / Yuan)</option>
          <option value="AED">AED (Emirati Dirham)</option>
        </select>
      </div>

      <div class="two-col-grid" style="gap: 16px;">
        <div class="form-group">
          <label class="form-label" for="reg_password">Password</label>
          <input type="password" id="reg_password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg_confirm_password">Confirm Password</label>
          <input type="password" id="reg_confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" id="btn-register">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="{{ url_for('auth.login') }}" style="color: var(--accent-primary); font-weight: 600;">Sign In</a>
    </div>

  </div>
</div>
{% endblock %}
